{% extends 'base.html' %}

{% block title %}Users{% endblock %}

{% block content %}

<div class="top-bar">

    <h1>Employee</h1>

    <a href="{{ url_for('user.create') }}" class="btn">
        + Add User
    </a>

</div>

{% for user in users %}

<div class="card">

    <h2>{{ user.username }}</h2>

    <div class="meta">
        Email: {{ user.email }}
    </div>

    <div class="meta">
        Basic Salary: ₱{{ user.basic_salary }}
    </div>

    <div class="actions">

        <a
            href="{{ url_for('user.update', id=user.id) }}"
            class="btn"
        >
            Edit
        </a>

        <a
            href="{{ url_for('user.delete', id=user.id) }}"
            class="btn delete"
            onclick="return confirm('Are you sure you want to delete this user?');"
        >
            Delete
        </a>

    </div>

</div>

{% endfor %}

{% endblock %}
