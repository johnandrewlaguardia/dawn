{% extends 'base.html' %}

{% block content %}

<div class="card">

    <h1>Update User</h1>

    <form method="POST">

        <p>Username</p>

        <input
            type="text"
            name="username"
            value="{{ user.username }}"
            required
        >

        <br><br>

        <p>Email</p>

        <input
            type="email"
            name="email"
            value="{{ user.email }}"
            required
        >

        <br><br>

        <p>Basic Salary</p>

        <input
            type="number"
            name="basic_salary"
            value="{{ user.basic_salary }}"
            step="0.01"
            required
        >

        <br><br>

        <button type="submit">
            Update User
        </button>

    </form>

</div>

{% endblock %}
