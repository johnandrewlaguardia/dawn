{% extends 'base.html' %}

{% block content %}

<div class="card">

    <h1>Create Payroll</h1>

    <form method="POST">

        <p>Employee</p>

        <select name="user_id" required>

            {% for user in users %}

            <option value="{{ user.id }}">
                {{ user.username }}
            </option>

            {% endfor %}

        </select>

        <br><br>

        <p>Allowance</p>

        <input
            type="number"
            name="allowance"
            step="0.01"
            required
        >

        <br><br>

        <p>Overtime</p>

        <input
            type="number"
            name="overtime"
            step="0.01"
            required
        >

        <br><br>

        <p>Deduction</p>

        <input
            type="number"
            name="deduction"
            step="0.01"
            required
        >

        <br><br>

        <p>Payroll Date</p>

        <input
            type="date"
            name="payroll_date"
            required
        >

        <br><br>

        <p>Payroll Period (Optional)</p>

        <input
            type="date"
            name="payroll_period"
        >

        <br><br>

        <button type="submit">
            Save Payroll
        </button>

    </form>

</div>

{% endblock %}
