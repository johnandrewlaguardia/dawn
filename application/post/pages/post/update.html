{% extends 'base.html' %}

{% block title %}Update Post{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Update Post</h1>

    <form method="POST">

        <div class="form-group">
            <label>Title</label>

            <input
                type="text"
                name="title"
                value="{{ post.title }}"
                required
            >
        </div>

        <div class="form-group">
            <label>Body</label>

            <textarea
                name="body"
                rows="8"
                required
            >{{ post.body }}</textarea>
        </div>

        <button type="submit" class="btn">
            Update Post
        </button>

    </form>

</div>

{% endblock %}
