{% extends 'base.html' %}

{% block title %}Posts{% endblock %}

{% block content %}

<div class="top-bar">

    <h1>Blog Posts</h1>

    <a href="{{ url_for('post.create') }}" class="btn">
        + Create Post
    </a>

</div>

{% for post in posts %}

<div class="card">

    <h2>{{ post.title }}</h2>

    <div class="meta">
        By {{ post.username }} | {{ post.email }}
    </div>

    <p>
        {{ post.body }}
    </p>

    <div class="actions">

        <a
            href="{{ url_for('post.update', id=post.id) }}"
            class="btn"
        >
            Edit
        </a>

        <a
            href="{{ url_for('post.delete', id=post.id) }}"
            class="btn delete"
            onclick="return confirm('Are you sure you want to delete this post?');"
        >
            Delete
        </a>

    </div>

</div>

{% else %}

<div class="card">
    <p>No posts available.</p>
</div>

{% endfor %}

{% endblock %}
