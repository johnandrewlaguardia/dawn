{% extends 'base.html' %}

{% block title %}Create Post{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Create Blog Post</h1>

    <form method="POST">

        <div class="form-group">
            <label>Username</label>

            <input
                type="text"
                name="username"
                required
            >
        </div>

        <div class="form-group">
            <label>Email</label>

            <input
                type="email"
                name="email"
                required
            >
        </div>

        <div class="form-group">
            <label>Title</label>

            <input
                type="text"
                name="title"
                required
            >
        </div>

        <div class="form-group">
            <label>Body</label>

            <textarea
                name="body"
                rows="8"
                required
            ></textarea>
        </div>

        <button type="submit" class="btn">
            Save Post
        </button>

    </form>

</div>

{% endblock %}
